<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Bereich — Urban Kids Club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #D4956A; --primary-hover: #c4854a; --bg: #faf9f8; --card: #fff; --text: #3C2225; --muted: #8B7355; --border: #e8e0d8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.header { background:white; border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:18px; font-weight:700; }
.header .user { font-size:13px; color:var(--muted); }
.container { max-width:720px; margin:0 auto; padding:20px; }
.tabs { display:flex; gap:4px; background:white; border-radius:12px; padding:4px; margin-bottom:20px; border:1px solid var(--border); }
.tab { flex:1; padding:10px; text-align:center; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer; color:var(--muted); transition:all .2s; }
.tab.active { background:var(--primary); color:white; }
.tab:hover:not(.active) { background:#f5f0eb; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:12px; }
.card h3 { font-size:15px; font-weight:600; margin-bottom:8px; }
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.badge-green { background:#ecfdf5; color:#059669; }
.badge-amber { background:#fffbeb; color:#d97706; }
.badge-red { background:#fef2f2; color:#ef4444; }
.badge-gray { background:#f3f4f6; color:#6b7280; }
.btn { padding:12px 24px; background:var(--primary); color:white; border:none; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .2s; }
.btn:hover { background:var(--primary-hover); }
.btn-sm { padding:8px 16px; font-size:12px; border-radius:8px; }
.btn-outline { background:transparent; border:2px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--primary); color:var(--primary); background:transparent; }
input[type=email], input[type=text], textarea { width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:12px; font-size:14px; font-family:inherit; outline:none; }
input:focus, textarea:focus { border-color:var(--primary); }
.empty { text-align:center; padding:40px; color:var(--muted); }
.empty .icon { font-size:48px; margin-bottom:12px; }
.msg { padding:12px 16px; border-radius:12px; margin-bottom:8px; max-width:80%; }
.msg-provider { background:#f0ebe6; margin-right:auto; }
.msg-parent { background:var(--primary); color:white; margin-left:auto; }
.msg-time { font-size:10px; opacity:.6; margin-top:4px; }
.login-card { max-width:400px; margin:80px auto; text-align:center; }
.login-card .logo { font-size:48px; margin-bottom:16px; }
#app { display:none; }
.footer { text-align:center; font-size:11px; color:#94a3b8; margin-top:32px; padding:16px; }
.toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); padding:0.75rem 1.5rem; border-radius:12px; font-size:0.875rem; font-weight:500; z-index:100; animation:toastIn 0.3s ease,toastOut 0.3s ease 2.7s forwards; box-shadow:0 8px 25px rgba(0,0,0,0.15); }
.toast-error { background:#dc2626; color:white; }
.toast-success { background:#059669; color:white; }
.toast-info { background:#3C2124; color:white; }
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; } }
.filter-bar { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.filter-btn { padding:6px 14px; border:1px solid var(--border); background:white; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; color:var(--muted); transition:all .2s; font-family:inherit; }
.filter-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
.filter-btn:hover:not(.active) { border-color:var(--primary); color:var(--primary); }
.inbox-item { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s; }
.inbox-item:last-child { border-bottom:none; }
.inbox-item:hover { background:#f5f0eb; }
.inbox-item.unread { background:#fffbf5; }
.inbox-avatar { width:40px; height:40px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0; }
.inbox-preview { flex:1; min-width:0; }
.inbox-preview h4 { font-size:14px; font-weight:600; margin-bottom:2px; }
.inbox-preview p { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.inbox-meta { text-align:right; flex-shrink:0; }
.inbox-meta .time { font-size:11px; color:var(--muted); }
.inbox-meta .unread-dot { width:10px; height:10px; border-radius:50%; background:var(--primary); margin-top:4px; margin-left:auto; }
.thread-header { display:flex; align-items:center; gap:12px; padding-bottom:16px; border-bottom:1px solid var(--border); margin-bottom:16px; }
.msg-sender { font-size:11px; font-weight:600; margin-bottom:2px; color:var(--muted); }
.msg-parent .msg-sender { color:rgba(255,255,255,0.8); }
.invoice-row { display:flex; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
.invoice-row:last-child { border-bottom:none; }
@media (max-width:599px) { .invoice-row { flex-direction:column; align-items:flex-start; } }
select { padding:8px 12px; border:2px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; outline:none; background:white; cursor:pointer; }
select:focus { border-color:var(--primary); }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="container login-card">
    <div class="card" style="padding:40px">
      <div class="logo">👋</div>
      <h2 style="margin-bottom:8px">Willkommen!</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:24px">Gib deine E-Mail-Adresse ein und wir senden dir einen Magic Link zum Einloggen. Kein Passwort noetig.</p>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="deine@email.de" required autocomplete="email" style="margin-bottom:12px">
        <button type="submit" class="btn" style="width:100%" id="loginBtn">Magic Link senden</button>
      </form>
      <div id="loginMsg" style="margin-top:16px"></div>
    </div>
  </div>
</div>

<!-- Main App (hidden until logged in) -->
<div id="app">
  <div class="header">
    <h1>Mein Bereich</h1>
    <div class="flex" style="display:flex;align-items:center;gap:12px">
      <span class="user" id="userName"></span>
      <button onclick="logout()" class="btn-sm btn-outline">Abmelden</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs" id="navTabs">
      <div class="tab active" onclick="switchTab('bookings')" id="tab-bookings">Buchungen</div>
      <div class="tab" onclick="switchTab('credits')" id="tab-credits">Guthaben</div>
      <div class="tab" onclick="switchTab('messages')" id="tab-messages" style="position:relative">Postfach <span id="badge-messages" style="display:none;position:absolute;top:2px;right:4px;background:#ef4444;color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center"></span></div>
      <div class="tab" onclick="switchTab('invoices')" id="tab-invoices" style="position:relative">Rechnungen <span id="badge-invoices" style="display:none;position:absolute;top:2px;right:4px;background:#ef4444;color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center"></span></div>
    </div>
    <div id="content"></div>
  </div>

  <div class="footer">Powered by Urban Kids Club</div>
</div>

<script>
function showToast(message, type = 'info') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3200);
}

const API = '';
let sessionToken = localStorage.getItem('ukc_parent_session') || null;
let parentData = null;
let _supabaseClient = null;

// Initialize Supabase client for auth (reads config from meta tag or env)
function getSupabaseClient() {
  if (_supabaseClient) return _supabaseClient;
  // Config is injected by the server or falls back to known dev values
  const meta = document.querySelector('meta[name="supabase-url"]');
  const metaKey = document.querySelector('meta[name="supabase-anon-key"]');
  const sbUrl = meta ? meta.content : (window.__SUPABASE_URL || 'https://yuilhiqnrjuuqoqggihm.supabase.co');
  const sbKey = metaKey ? metaKey.content : (window.__SUPABASE_ANON_KEY || '');
  if (sbUrl && sbKey && window.supabase) {
    _supabaseClient = window.supabase.createClient(sbUrl, sbKey);
  }
  return _supabaseClient;
}

// Listen for Supabase auth state changes (token refresh, sign-in, sign-out)
(function() {
  var sb = getSupabaseClient();
  if (sb) {
    sb.auth.onAuthStateChange(function(event, session) {
      if (event === 'TOKEN_REFRESHED' && session) {
        sessionToken = session.access_token;
        localStorage.setItem('ukc_parent_session', sessionToken);
      } else if (event === 'SIGNED_OUT') {
        sessionToken = null;
        localStorage.removeItem('ukc_parent_session');
      }
    });
  }
})();

// Check for legacy magic link token in URL
const urlParams = new URLSearchParams(window.location.search);
const magicToken = urlParams.get('token');

async function init() {
  // 1. Handle Supabase Auth callback (magic link redirect with hash fragment)
  const sb = getSupabaseClient();
  if (sb) {
    try {
      // Supabase magic links redirect with #access_token=...&type=magiclink
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = hashParams.get('access_token');
      const tokenType = hashParams.get('type');
      if (accessToken && (tokenType === 'magiclink' || tokenType === 'recovery')) {
        const refreshToken = hashParams.get('refresh_token') || '';
        const { data, error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        if (!error && data.session) {
          sessionToken = data.session.access_token;
          localStorage.setItem('ukc_parent_session', sessionToken);
          history.replaceState({}, '', '/portal/');
          // Load parent data
          const r = await fetch(API + '/api/portal/auth/session', { headers: { 'Authorization': 'Bearer ' + sessionToken } });
          if (r.ok) {
            const d = await r.json();
            parentData = d.data?.parent;
            showApp();
            return;
          }
        }
      }

      // Check for existing Supabase session
      const { data: { session } } = await sb.auth.getSession();
      if (session?.access_token) {
        sessionToken = session.access_token;
        localStorage.setItem('ukc_parent_session', sessionToken);
        const r = await fetch(API + '/api/portal/auth/session', { headers: { 'Authorization': 'Bearer ' + sessionToken } });
        if (r.ok) {
          const d = await r.json();
          parentData = d.data?.parent;
          if (parentData) { showApp(); return; }
        }
      }
    } catch(e) {
      console.warn('[Portal] Supabase auth check failed:', e);
    }
  }

  // 2. Handle legacy magic link token (?token=...)
  if (magicToken) {
    try {
      const r = await fetch(API + '/api/portal/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token: magicToken }) });
      const d = await r.json();
      if (d.data?.sessionToken) {
        sessionToken = d.data.sessionToken;
        parentData = d.data.parent;
        localStorage.setItem('ukc_parent_session', sessionToken);
        history.replaceState({}, '', '/portal/');
        showApp();
        return;
      }
    } catch(e) {}
    document.getElementById('loginMsg').innerHTML = '<p style="color:#ef4444">Link ungueltig oder abgelaufen. Bitte fordere einen neuen an.</p>';
  }

  // 3. Try existing session token (Supabase JWT or legacy)
  if (sessionToken) {
    try {
      const r = await fetch(API + '/api/portal/auth/session', { headers: { 'Authorization': 'Bearer ' + sessionToken } });
      if (r.ok) {
        const d = await r.json();
        parentData = d.data?.parent;
        showApp();
        return;
      }
    } catch(e) {}
    // Fallback: try legacy /api/portal/me
    try {
      const r = await fetch(API + '/api/portal/me', { headers: { 'Authorization': 'Bearer ' + sessionToken } });
      if (r.ok) {
        const d = await r.json();
        parentData = d.data;
        showApp();
        return;
      }
    } catch(e) {}
    // Session invalid
    localStorage.removeItem('ukc_parent_session');
    sessionToken = null;
  }

  // Show login
  document.getElementById('loginScreen').style.display = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('userName').textContent = parentData?.name || '';
  switchTab('bookings');
  // Load badge counts async
  updateNavBadges();
}

async function updateNavBadges() {
  try {
    // Unread messages badge
    const messages = await apiFetch('/api/portal/messages');
    const unreadCount = messages.filter(function(m) { return m.sender_type === 'provider' && !m.read_at; }).length;
    const msgBadge = document.getElementById('badge-messages');
    if (unreadCount > 0) {
      msgBadge.textContent = unreadCount > 9 ? '9+' : unreadCount;
      msgBadge.style.display = '';
    } else {
      msgBadge.style.display = 'none';
    }

    // Overdue invoices badge
    const invoices = await apiFetch('/api/portal/invoices');
    const overdueCount = invoices.filter(function(inv) { return inv.isOverdue; }).length;
    const invBadge = document.getElementById('badge-invoices');
    if (overdueCount > 0) {
      invBadge.textContent = overdueCount;
      invBadge.style.display = '';
    } else {
      invBadge.style.display = 'none';
    }
  } catch(e) { /* badge loading is non-critical */ }
}

async function logout() {
  // Notify server
  try {
    await fetch(API + '/api/portal/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + sessionToken } });
  } catch(e) {}
  // Sign out from Supabase client
  const sb = getSupabaseClient();
  if (sb) { try { await sb.auth.signOut(); } catch(e) {} }
  localStorage.removeItem('ukc_parent_session');
  sessionToken = null;
  parentData = null;
  location.reload();
}

// Login form
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Wird gesendet...';
  try {
    const resp = await fetch(API + '/api/portal/auth/magic-link', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
    if (resp.status === 429) {
      document.getElementById('loginMsg').innerHTML = '<p style="color:#ef4444">Zu viele Versuche. Bitte spaeter erneut probieren.</p>';
      btn.disabled = false; btn.textContent = 'Magic Link senden';
      return;
    }
    document.getElementById('loginMsg').innerHTML = '<div class="card" style="background:#ecfdf5;border-color:#a7f3d0"><p style="font-weight:600;color:#059669">Login-Link gesendet!</p><p style="font-size:13px;color:#047857;margin-top:4px">Wir haben dir einen Login-Link per E-Mail geschickt. Klicke darauf, um dich einzuloggen.</p></div>';
    document.getElementById('loginForm').style.display = 'none';
  } catch(e) {
    document.getElementById('loginMsg').innerHTML = '<p style="color:#ef4444">Fehler beim Senden.</p>';
    btn.disabled = false; btn.textContent = 'Magic Link senden';
  }
});

async function apiFetch(path) {
  const r = await fetch(API + path, { headers: { 'Authorization': 'Bearer ' + sessionToken } });
  if (!r.ok) throw new Error('API error');
  return (await r.json()).data;
}

async function apiPost(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Authorization': 'Bearer ' + sessionToken, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return (await r.json()).data;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

let currentTab = 'bookings';
const tabOrder = ['bookings','credits','messages','invoices'];
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#navTabs .tab').forEach(function(t,i) {
    t.classList.toggle('active', tabOrder[i] === tab);
  });
  if (tab === 'bookings') renderBookings();
  else if (tab === 'credits') renderCredits();
  else if (tab === 'invoices') renderInvoices();
  else if (tab === 'messages') renderMessages();
}

const statusLabels = { confirmed: 'Bestätigt', pending: 'Ausstehend', cancelled: 'Storniert', completed: 'Abgeschlossen', waitlisted: 'Warteliste' };
const statusBadge = { confirmed: 'badge-green', pending: 'badge-amber', cancelled: 'badge-red', completed: 'badge-gray', waitlisted: 'badge-amber' };
const payLabels = { paid: 'Bezahlt', unpaid: 'Offen', refunded: 'Erstattet' };
const payBadge = { paid: 'badge-green', unpaid: 'badge-amber', refunded: 'badge-gray' };

function renderBookingCard(b) {
  const ci = b.child_info || {};
  const childName = ci.firstName ? (ci.firstName + ' ' + (ci.lastName||'')).trim() : 'Kind';
  const date = new Date(b.created_at).toLocaleDateString('de-DE');
  let scheduleInfo = '';
  if (b.schedule && Array.isArray(b.schedule) && b.schedule.length) {
    const dayNames = { monday:'Mo', tuesday:'Di', wednesday:'Mi', thursday:'Do', friday:'Fr', saturday:'Sa', sunday:'So' };
    scheduleInfo = b.schedule.map(function(s) { return (dayNames[s.day]||s.day) + ' ' + (s.startTime||'') + '–' + (s.endTime||''); }).join(', ');
  }
  return '<div class="card" style="cursor:pointer;transition:box-shadow .2s" onclick="showBookingDetail(\'' + b.id + '\')" onmouseenter="this.style.boxShadow=\'0 4px 12px rgba(0,0,0,0.08)\'" onmouseleave="this.style.boxShadow=\'none\'">' +
    '<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px">' +
    '<div style="flex:1;min-width:200px"><h3>' + esc(b.activityTitle) + '</h3>' +
    '<p style="font-size:13px;color:var(--muted);margin-top:2px">' + esc(b.providerName) + ' · ' + esc(childName) + '</p>' +
    (scheduleInfo ? '<p style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(scheduleInfo) + '</p>' : '') +
    '<p style="font-size:12px;color:var(--muted);margin-top:2px">Gebucht am ' + date + '</p></div>' +
    '<div style="display:flex;gap:6px;flex-shrink:0">' +
    '<span class="badge ' + (statusBadge[b.status]||'badge-gray') + '">' + (statusLabels[b.status]||b.status) + '</span>' +
    '<span class="badge ' + (payBadge[b.payment_status]||'badge-gray') + '">' + (payLabels[b.payment_status]||b.payment_status) + '</span>' +
    '</div></div>' +
    (b.payment_status === 'unpaid' && b.amount_paid === 0 ? '<p style="font-size:13px;color:#d97706;margin-top:8px">Zahlung ausstehend — bitte vor Ort begleichen.</p>' : '') +
    '</div>';
}

async function renderBookings() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty"><div class="icon">⏳</div>Lade...</div>';
  try {
    const bookings = await apiFetch('/api/portal/bookings');
    if (!bookings.length) {
      el.innerHTML = '<div class="empty"><div class="icon">📅</div><p>Noch keine Buchungen.</p></div>';
      return;
    }

    // Split into active (confirmed/pending/waitlisted) and past (completed/cancelled)
    const active = bookings.filter(function(b) { return ['confirmed','pending','waitlisted'].includes(b.status); });
    const past = bookings.filter(function(b) { return ['completed','cancelled'].includes(b.status); });

    let html = '';
    if (active.length) {
      html += '<h2 style="font-size:15px;font-weight:600;margin-bottom:12px;color:var(--text)">Aktive Buchungen</h2>';
      html += active.map(renderBookingCard).join('');
    }
    if (past.length) {
      html += '<h2 style="font-size:15px;font-weight:600;margin:20px 0 12px;color:var(--muted)">Vergangene Buchungen</h2>';
      html += past.map(renderBookingCard).join('');
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="empty"><div class="icon">⚠️</div>Fehler beim Laden.</div>'; }
}

async function showBookingDetail(bookingId) {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty"><div class="icon">⏳</div>Lade...</div>';
  try {
    const b = await apiFetch('/api/portal/bookings/' + bookingId);
    const ci = b.child_info || {};
    const childName = ci.firstName ? (ci.firstName + ' ' + (ci.lastName||'')).trim() : 'Kind';
    const bookedDate = new Date(b.created_at).toLocaleDateString('de-DE');

    let html = '<div style="margin-bottom:16px"><button onclick="renderBookings()" class="btn-sm btn-outline" style="font-size:13px">← Zurück</button></div>';

    // Header card
    html += '<div class="card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px">';
    html += '<div><h3 style="font-size:18px">' + esc(b.activityTitle) + '</h3>';
    html += '<p style="font-size:14px;color:var(--muted);margin-top:4px">' + esc(b.providerName) + '</p></div>';
    html += '<div style="display:flex;gap:6px">';
    html += '<span class="badge ' + (statusBadge[b.status]||'badge-gray') + '">' + (statusLabels[b.status]||b.status) + '</span>';
    html += '<span class="badge ' + (payBadge[b.payment_status]||'badge-gray') + '">' + (payLabels[b.payment_status]||b.payment_status) + '</span>';
    html += '</div></div>';

    // Details grid
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;font-size:13px">';
    html += '<div><span style="color:var(--muted)">Kind</span><br><strong>' + esc(childName) + '</strong></div>';
    html += '<div><span style="color:var(--muted)">Gebucht am</span><br><strong>' + bookedDate + '</strong></div>';
    if (b.amount_paid !== null && b.amount_paid !== undefined) {
      html += '<div><span style="color:var(--muted)">Bezahlt</span><br><strong>' + Number(b.amount_paid).toFixed(2).replace('.',',') + ' ' + (b.currency||'EUR') + '</strong></div>';
    }
    if (b.payment_method) {
      const methodLabels = { cash: 'Bar', bank_transfer: 'Überweisung', sepa: 'SEPA', card: 'Karte', online: 'Online' };
      html += '<div><span style="color:var(--muted)">Zahlungsart</span><br><strong>' + (methodLabels[b.payment_method]||b.payment_method) + '</strong></div>';
    }
    html += '</div>';
    html += '</div>';

    // Sessions list
    if (b.sessions && b.sessions.length) {
      html += '<h2 style="font-size:15px;font-weight:600;margin:20px 0 12px">Termine</h2>';
      const today = new Date().toISOString().split('T')[0];
      const sessionStatusLabels = { scheduled: 'Geplant', completed: 'Stattgefunden', cancelled: 'Ausgefallen' };
      const sessionStatusBadge = { scheduled: 'badge-green', completed: 'badge-gray', cancelled: 'badge-red' };
      for (const s of b.sessions) {
        const dateStr = new Date(s.date + 'T00:00:00').toLocaleDateString('de-DE', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' });
        const isPast = s.date < today;
        const sStatus = s.status || (isPast ? 'completed' : 'scheduled');
        html += '<div class="card" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center' + (isPast ? ';opacity:0.6' : '') + '">';
        html += '<div><strong style="font-size:13px">' + dateStr + '</strong>';
        if (s.start_time) html += '<span style="font-size:12px;color:var(--muted);margin-left:8px">' + esc(s.start_time) + (s.end_time ? ' – ' + esc(s.end_time) : '') + '</span>';
        html += '</div>';
        html += '<span class="badge ' + (sessionStatusBadge[sStatus]||'badge-gray') + '">' + (sessionStatusLabels[sStatus]||sStatus) + '</span>';
        html += '</div>';
      }
    }

    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="empty"><div class="icon">⚠️</div>Fehler beim Laden der Buchungsdetails.</div>'; }
}

let _creditsView = 'overview';

async function renderCredits() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty"><div class="icon">⏳</div>Lade...</div>';
  try {
    if (_creditsView === 'history') {
      await renderCreditHistory(el);
      return;
    }

    const credits = await apiFetch('/api/portal/credits');
    const childIds = Object.keys(credits);

    if (!childIds.length) {
      el.innerHTML = '<div class="empty"><div class="icon">🎟️</div><p>Noch keine Guthaben vorhanden.</p><p style="font-size:13px;color:var(--muted);margin-top:8px">Guthaben entstehen durch rechtzeitige Absagen oder ausgefallene Termine.</p></div>';
      return;
    }

    let html = '';

    for (var ci = 0; ci < childIds.length; ci++) {
      var childId = childIds[ci];
      var c = credits[childId];
      html += '<div class="card" style="border-left:4px solid var(--primary)">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">';
      html += '<div>';
      html += '<h3 style="font-size:15px;margin-bottom:4px">' + esc(c.childName) + '</h3>';
      html += '<p style="font-size:12px;color:var(--muted)">' + c.used + ' eingelöst · ' + c.expired + ' abgelaufen</p>';
      html += '</div>';
      html += '<div style="text-align:right">';
      html += '<div style="font-size:28px;font-weight:700;color:var(--primary)">' + c.available + '</div>';
      html += '<div style="font-size:12px;color:var(--muted)">verfügbar</div>';
      html += '</div>';
      html += '</div>';

      // Show available credits detail
      var availableCredits = c.credits.filter(function(cr) { return cr.status === 'available'; });
      if (availableCredits.length > 0) {
        html += '<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">';
        for (var j = 0; j < availableCredits.length; j++) {
          var cr = availableCredits[j];
          var reasonLabel = cr.reason === 'provider_cancellation' ? 'Termin ausgefallen' : 'Eigene Absage';
          var validDate = new Date(cr.valid_until + 'T00:00:00').toLocaleDateString('de-DE');
          var origDate = new Date(cr.original_session_date + 'T00:00:00').toLocaleDateString('de-DE');
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;flex-wrap:wrap;gap:4px">';
          html += '<div><span class="badge badge-green" style="margin-right:6px">Verfügbar</span>' + esc(reasonLabel) + ' (' + origDate + ')</div>';
          html += '<div style="color:var(--muted);font-size:12px">Gültig bis ' + validDate + '</div>';
          html += '</div>';
        }
        html += '</div>';
      }

      html += '</div>';
    }

    html += '<div style="text-align:center;margin-top:16px"><button onclick="_creditsView=\'history\';renderCredits()" class="btn-sm btn-outline">Guthaben-Verlauf anzeigen</button></div>';

    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="empty"><div class="icon">⚠️</div>Fehler beim Laden.</div>'; }
}

async function renderCreditHistory(el) {
  try {
    var history = await apiFetch('/api/portal/credits/history');
    if (!history.length) {
      el.innerHTML = '<div style="margin-bottom:16px"><button onclick="_creditsView=\'overview\';renderCredits()" class="btn-sm btn-outline">← Übersicht</button></div>' +
        '<div class="empty"><div class="icon">🎟️</div><p>Keine Guthaben-Transaktionen.</p></div>';
      return;
    }

    var reasonLabels = { parent_cancellation: 'Eigene Absage', provider_cancellation: 'Termin ausgefallen' };
    var creditStatusLabels = { available: 'Verfügbar', used: 'Eingelöst', expired: 'Abgelaufen' };
    var creditStatusBadge = { available: 'badge-green', used: 'badge-gray', expired: 'badge-red' };

    var html = '<div style="margin-bottom:16px"><button onclick="_creditsView=\'overview\';renderCredits()" class="btn-sm btn-outline">← Übersicht</button></div>';
    html += '<h2 style="font-size:15px;font-weight:600;margin-bottom:12px">Guthaben-Verlauf</h2>';

    for (var i = 0; i < history.length; i++) {
      var cr = history[i];
      var createdDate = new Date(cr.created_at).toLocaleDateString('de-DE');
      var origDate = new Date(cr.original_session_date + 'T00:00:00').toLocaleDateString('de-DE');
      html += '<div class="card" style="padding:14px 16px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px">';
      html += '<div>';
      html += '<div style="font-size:13px;font-weight:600">' + esc(cr.childName) + ' — ' + esc(reasonLabels[cr.reason] || cr.reason) + '</div>';
      html += '<p style="font-size:12px;color:var(--muted);margin-top:2px">Kurstyp: ' + esc(cr.activity_type || '–') + ' · Termin: ' + origDate + ' · Erstellt: ' + createdDate + '</p>';
      if (cr.status === 'used' && cr.used_at) {
        html += '<p style="font-size:12px;color:var(--muted)">Eingelöst am ' + new Date(cr.used_at).toLocaleDateString('de-DE') + '</p>';
      }
      if (cr.status === 'available') {
        html += '<p style="font-size:12px;color:#059669">Gültig bis ' + new Date(cr.valid_until + 'T00:00:00').toLocaleDateString('de-DE') + '</p>';
      }
      html += '</div>';
      html += '<span class="badge ' + (creditStatusBadge[cr.status]||'badge-gray') + '">' + (creditStatusLabels[cr.status]||cr.status) + '</span>';
      html += '</div>';
      html += '</div>';
    }

    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="empty"><div class="icon">⚠️</div>Fehler beim Laden.</div>'; }
}

// ── Rechnungen (Invoices) with filter ──────────────────────
var _allInvoices = [];
var _invoiceFilter = 'all';

async function renderInvoices() {
  var el = document.getElementById('content');
  el.innerHTML = '<div class="empty"><div class="icon">⏳</div>Lade...</div>';
  try {
    _allInvoices = await apiFetch('/api/portal/invoices');
    if (!_allInvoices.length) {
      el.innerHTML = '<div class="empty"><div class="icon">🧾</div><p>Noch keine Rechnungen.</p></div>';
      return;
    }
    renderInvoiceList(el);
  } catch(e) { el.innerHTML = '<div class="empty"><div class="icon">⚠️</div>Fehler beim Laden.</div>'; }
}

function renderInvoiceList(el) {
  var invSL = { draft: 'Entwurf', sent: 'Offen', paid: 'Bezahlt', cancelled: 'Storniert' };
  var invSB = { draft: 'badge-gray', sent: 'badge-amber', paid: 'badge-green', cancelled: 'badge-red' };
  var counts = { all: _allInvoices.length, sent: 0, paid: 0, overdue: 0 };
  _allInvoices.forEach(function(inv) {
    if (inv.status === 'sent') counts.sent++;
    if (inv.status === 'paid') counts.paid++;
    if (inv.isOverdue) counts.overdue++;
  });
  var filtered = _allInvoices;
  if (_invoiceFilter === 'sent') filtered = _allInvoices.filter(function(i) { return i.status === 'sent' && !i.isOverdue; });
  else if (_invoiceFilter === 'overdue') filtered = _allInvoices.filter(function(i) { return i.isOverdue; });
  else if (_invoiceFilter === 'paid') filtered = _allInvoices.filter(function(i) { return i.status === 'paid'; });

  var html = '<div class="filter-bar">';
  html += '<button class="filter-btn' + (_invoiceFilter === 'all' ? ' active' : '') + '" onclick="_invoiceFilter=\'all\';renderInvoiceList(document.getElementById(\'content\'))">Alle (' + counts.all + ')</button>';
  html += '<button class="filter-btn' + (_invoiceFilter === 'sent' ? ' active' : '') + '" onclick="_invoiceFilter=\'sent\';renderInvoiceList(document.getElementById(\'content\'))">Offen (' + counts.sent + ')</button>';
  if (counts.overdue > 0) {
    html += '<button class="filter-btn' + (_invoiceFilter === 'overdue' ? ' active' : '') + '" onclick="_invoiceFilter=\'overdue\';renderInvoiceList(document.getElementById(\'content\'))" style="' + (_invoiceFilter !== 'overdue' ? 'border-color:#ef4444;color:#ef4444' : '') + '">\u00DCberf\u00E4llig (' + counts.overdue + ')</button>';
  }
  html += '<button class="filter-btn' + (_invoiceFilter === 'paid' ? ' active' : '') + '" onclick="_invoiceFilter=\'paid\';renderInvoiceList(document.getElementById(\'content\'))">Bezahlt (' + counts.paid + ')</button>';
  html += '</div>';

  if (!filtered.length) {
    html += '<div class="empty" style="padding:24px"><p>Keine Rechnungen in dieser Kategorie.</p></div>';
  } else {
    html += '<div class="card" style="padding:0;overflow:hidden">';
    filtered.forEach(function(inv) {
      var issued = inv.issued_at ? new Date(inv.issued_at).toLocaleDateString('de-DE') : '';
      var due = inv.due_date ? new Date(inv.due_date).toLocaleDateString('de-DE') : '';
      var displayLabel = inv.isOverdue ? '\u00DCberf\u00E4llig' : (invSL[inv.status] || inv.status);
      var displayBadge = inv.isOverdue ? 'badge-red' : (invSB[inv.status] || 'badge-gray');
      html += '<div style="padding:14px 16px;border-bottom:1px solid var(--border)">';
      html += '<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px">';
      html += '<div style="flex:1;min-width:180px">';
      html += '<h3 style="font-size:14px;font-weight:600;margin-bottom:2px">' + esc(inv.number) + '</h3>';
      html += '<p style="font-size:12px;color:var(--muted)">' + esc(inv.providerName || '') + '</p>';
      html += '<p style="font-size:12px;color:var(--muted)">Erstellt: ' + issued + (due ? ' \u00B7 F\u00E4llig: ' + due : '') + '</p>';
      html += '</div>';
      html += '<div style="display:flex;align-items:center;gap:12px;flex-shrink:0">';
      html += '<span style="font-size:17px;font-weight:700">' + Number(inv.total || 0).toFixed(2).replace('.', ',') + ' \u20AC</span>';
      html += '<span class="badge ' + displayBadge + '">' + displayLabel + '</span>';
      html += '</div></div>';
      if (inv.status === 'sent' || inv.status === 'paid') {
        html += '<div style="display:flex;gap:8px;margin-top:10px">';
        html += '<a href="/api/invoices/' + inv.id + '/view?token=' + encodeURIComponent(sessionToken || '') + '" target="_blank" class="btn-sm btn-outline" style="display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:12px;padding:6px 12px;border-width:1px">Rechnung ansehen</a>';
        html += '<a href="/api/invoices/' + inv.id + '/view?token=' + encodeURIComponent(sessionToken || '') + '" target="_blank" class="btn-sm btn-outline" style="display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:12px;padding:6px 12px;border-width:1px">PDF herunterladen</a>';
        html += '</div>';
      }
      if (inv.isOverdue) {
        html += '<p style="font-size:12px;color:#ef4444;margin-top:8px;font-weight:500">Diese Rechnung ist \u00FCberf\u00E4llig. Bitte zeitnah begleichen.</p>';
      }
      html += '</div>';
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

// ── Postfach (Messages) with inbox + thread view ───────────
var _messages = [];
var _msgProviders = new Map();
var _selectedProvider = null;
var _msgView = 'inbox';

async function renderMessages() {
  var el = document.getElementById('content');
  el.innerHTML = '<div class="empty"><div class="icon">⏳</div>Lade...</div>';
  try {
    _messages = await apiFetch('/api/portal/messages');
    _msgProviders = new Map();
    for (var i = 0; i < _messages.length; i++) {
      var m = _messages[i];
      if (!_msgProviders.has(m.provider_id)) _msgProviders.set(m.provider_id, { name: m.providerName, messages: [] });
      _msgProviders.get(m.provider_id).messages.push(m);
    }
    var bookings = await apiFetch('/api/portal/bookings');
    for (var j = 0; j < bookings.length; j++) {
      var b = bookings[j];
      if (!_msgProviders.has(b.provider_id)) _msgProviders.set(b.provider_id, { name: b.providerName, messages: [] });
    }
    if (_msgProviders.size === 0) {
      el.innerHTML = '<div class="empty"><div class="icon">💬</div><p>Noch keine Nachrichten.</p></div>';
      return;
    }
    if (_msgView === 'thread' && _selectedProvider) {
      renderThread(el);
    } else {
      renderInbox(el);
    }
  } catch(e) { el.innerHTML = '<div class="empty"><div class="icon">⚠️</div>Fehler beim Laden.</div>'; }
}

function renderInbox(el) {
  var html = '<h2 style="font-size:15px;font-weight:600;margin-bottom:12px">Postfach</h2>';
  html += '<div class="card" style="padding:0;overflow:hidden">';
  var provEntries = Array.from(_msgProviders.entries());
  provEntries.sort(function(a, b) {
    var aU = a[1].messages.filter(function(m) { return m.sender_type === 'provider' && !m.read_at; }).length;
    var bU = b[1].messages.filter(function(m) { return m.sender_type === 'provider' && !m.read_at; }).length;
    if (aU > 0 && bU === 0) return -1;
    if (bU > 0 && aU === 0) return 1;
    var aL = a[1].messages.length ? new Date(a[1].messages[0].created_at).getTime() : 0;
    var bL = b[1].messages.length ? new Date(b[1].messages[0].created_at).getTime() : 0;
    return bL - aL;
  });
  for (var i = 0; i < provEntries.length; i++) {
    var id = provEntries[i][0];
    var prov = provEntries[i][1];
    var unread = prov.messages.filter(function(m) { return m.sender_type === 'provider' && !m.read_at; }).length;
    var lastMsg = prov.messages.length > 0 ? prov.messages[0] : null;
    var preview = lastMsg ? lastMsg.content : 'Noch keine Nachrichten';
    if (preview.length > 60) preview = preview.substring(0, 60) + '...';
    var timeStr = lastMsg ? fmtRelDate(lastMsg.created_at) : '';
    var initial = prov.name ? prov.name.charAt(0).toUpperCase() : '?';
    html += '<div class="inbox-item' + (unread > 0 ? ' unread' : '') + '" onclick="openThread(\'' + id + '\')">';
    html += '<div class="inbox-avatar">' + esc(initial) + '</div>';
    html += '<div class="inbox-preview">';
    html += '<h4' + (unread > 0 ? ' style="color:var(--text)"' : ' style="color:var(--muted)"') + '>' + esc(prov.name) + '</h4>';
    html += '<p>' + (lastMsg && lastMsg.sender_type === 'parent' ? 'Du: ' : '') + esc(preview) + '</p>';
    html += '</div>';
    html += '<div class="inbox-meta">';
    html += '<div class="time">' + esc(timeStr) + '</div>';
    if (unread > 0) {
      html += '<div style="background:var(--primary);color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-top:4px;display:inline-block;float:right">' + unread + '</div>';
    }
    html += '</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function fmtRelDate(dateStr) {
  var d = new Date(dateStr);
  var now = new Date();
  var mins = Math.floor((now.getTime() - d.getTime()) / 60000);
  if (mins < 1) return 'Jetzt';
  if (mins < 60) return mins + ' Min.';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + ' Std.';
  var days = Math.floor(hours / 24);
  if (days === 1) return 'Gestern';
  if (days < 7) return days + ' Tage';
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
}

function openThread(providerId) {
  _selectedProvider = providerId;
  _msgView = 'thread';
  apiPost('/api/portal/messages/mark-read', { providerId: providerId }).then(function() {
    updateNavBadges();
  }).catch(function() {});
  renderThread(document.getElementById('content'));
}

function renderThread(el) {
  var prov = _msgProviders.get(_selectedProvider);
  if (!prov) { renderInbox(el); return; }
  var html = '';
  html += '<div class="thread-header">';
  html += '<button onclick="_msgView=\'inbox\';_selectedProvider=null;renderMessages()" class="btn-sm btn-outline" style="font-size:13px;padding:6px 12px">\u2190</button>';
  html += '<div class="inbox-avatar" style="width:36px;height:36px;font-size:14px">' + esc(prov.name.charAt(0).toUpperCase()) + '</div>';
  html += '<div><h3 style="font-size:15px;margin-bottom:0">' + esc(prov.name) + '</h3></div>';
  html += '</div>';
  html += '<div style="overflow-y:auto;max-height:400px;display:flex;flex-direction:column;gap:8px;padding:4px 0" id="msgList">';
  if (!prov.messages.length) {
    html += '<div class="empty" style="padding:30px"><p style="font-size:13px">Noch keine Nachrichten. Schreibe die erste!</p></div>';
  } else {
    var sorted = prov.messages.slice().sort(function(a, b) { return new Date(a.created_at).getTime() - new Date(b.created_at).getTime(); });
    var lastDate = '';
    for (var i = 0; i < sorted.length; i++) {
      var sm = sorted[i];
      var msgDate = new Date(sm.created_at).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long' });
      if (msgDate !== lastDate) {
        html += '<div style="text-align:center;font-size:11px;color:var(--muted);padding:12px 0 4px">' + esc(msgDate) + '</div>';
        lastDate = msgDate;
      }
      var time = new Date(sm.created_at).toLocaleString('de-DE', { hour: '2-digit', minute: '2-digit' });
      var senderLabel = sm.sender_type === 'provider' ? esc(prov.name) : 'Du';
      html += '<div class="msg msg-' + sm.sender_type + '">';
      html += '<div class="msg-sender">' + senderLabel + '</div>';
      html += esc(sm.content);
      html += '<div class="msg-time">' + time + '</div>';
      html += '</div>';
    }
  }
  html += '</div>';
  html += '<div style="display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">';
  html += '<input type="text" id="msgInput" placeholder="Nachricht schreiben..." style="flex:1" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendMessage()}">';
  html += '<button onclick="sendMessage()" class="btn btn-sm">Senden</button>';
  html += '</div>';
  el.innerHTML = html;
  var list = document.getElementById('msgList');
  if (list) list.scrollTop = list.scrollHeight;
  if (prov.messages) {
    prov.messages.forEach(function(mm) {
      if (mm.sender_type === 'provider' && !mm.read_at) mm.read_at = new Date().toISOString();
    });
  }
}

async function sendMessage() {
  var input = document.getElementById('msgInput');
  var content = input ? input.value.trim() : '';
  if (!content || !_selectedProvider) return;
  input.value = '';
  input.disabled = true;
  try {
    await apiPost('/api/portal/messages/' + _selectedProvider, { content: content });
    _msgView = 'thread';
    await renderMessages();
  } catch(e) {
    showToast('Fehler beim Senden.', 'error');
    if (input) input.disabled = false;
  }
}

// Start
init();
