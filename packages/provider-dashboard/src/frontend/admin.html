<!DOCTYPE html>
<html lang="de" class="h-full bg-brand-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://yuilhiqnrjuuqoqggihm.supabase.co">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Urban Kids Club – Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FFF9F5',
              100: '#FFEFE1',
              200: '#F0D9C4',
              300: '#C49980',
              400: '#CC895E',
              500: '#B5533A',
              600: '#9A4432',
              700: '#3C2124',
              800: '#2D181A',
              900: '#1E1012',
            }
          },
          fontFamily: {
            heading: ['Barlow Condensed', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #FFF9F5; }
    h1, h2, h3, .page-title { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .provider-row:hover { background: #FFEFE1; cursor: pointer; }
    .provider-row { transition: background 0.15s ease; }
    .badge-onboarding { background: #FEF3C7; color: #92400E; }
    .badge-active { background: #D1FAE5; color: #065F46; }
    .badge-suspended { background: #FEE2E2; color: #991B1B; }
    .badge-archived { background: #E5E7EB; color: #6B7280; }
    .row-archived { opacity: 0.5; text-decoration: line-through; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; border-radius: 16px; padding: 24px; width: 600px; max-width: 95vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
  </style>
</head>
<body class="h-full">

  <!-- Login Screen -->
  <div id="loginScreen" style="display:flex" class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0" style="background:#1a0a00"></div>
    <div class="relative w-full max-w-md mx-4 rounded-2xl p-8 shadow-2xl" style="background:#2d1810;border:1px solid #5a3828">
      <div class="flex flex-col items-center mb-8">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mb-4" style="background:linear-gradient(135deg,#d4956a,#b87a50)">A</div>
        <h1 class="text-2xl font-bold font-heading" style="color:#f5e6d3">URBAN KIDS CLUB</h1>
        <p class="text-sm mt-1" style="color:#c49980">Admin Dashboard</p>
      </div>
      <div id="loginError" style="display:none" class="mb-4 p-3 rounded-lg text-sm" role="alert"></div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1.5" style="color:#f5e6d3">E-Mail</label>
          <input id="loginEmail" type="email" placeholder="admin@beispiel.de" class="w-full px-4 py-2.5 rounded-lg text-sm focus:outline-none focus:ring-2" style="background:#1a0a00;border:1px solid #5a3828;color:#f5e6d3" onkeydown="if(event.key==='Enter')document.getElementById('loginBtn').click()" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5" style="color:#f5e6d3">Passwort</label>
          <input id="loginPassword" type="password" placeholder="Passwort" class="w-full px-4 py-2.5 rounded-lg text-sm focus:outline-none focus:ring-2" style="background:#1a0a00;border:1px solid #5a3828;color:#f5e6d3" onkeydown="if(event.key==='Enter')document.getElementById('loginBtn').click()" />
        </div>
        <button id="loginBtn" onclick="doLogin()" class="w-full py-2.5 rounded-lg text-white font-semibold text-sm transition-all hover:opacity-90" style="background:linear-gradient(135deg,#CC895E,#B5533A)">Anmelden</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div id="mainContent" style="display:none" class="min-h-full">
    <!-- Top Bar -->
    <div class="sticky top-0 z-40 bg-white border-b border-brand-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold text-lg" style="background:linear-gradient(135deg,#d4956a,#b87a50)">A</div>
          <div>
            <h1 class="text-xl font-bold font-heading text-brand-800">ADMIN DASHBOARD</h1>
            <p class="text-xs text-brand-300" id="adminEmail"></p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button onclick="openCreateModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-white transition-all" style="background:linear-gradient(135deg,#CC895E,#B5533A)">+ Neuen Provider anlegen</button>
          <button onclick="loadProviders()" class="px-4 py-2 rounded-lg text-sm font-medium bg-brand-100 text-brand-700 hover:bg-brand-200 transition-all">Aktualisieren</button>
          <button onclick="doLogout()" class="px-4 py-2 rounded-lg text-sm font-medium bg-red-50 text-red-700 hover:bg-red-100 transition-all">Abmelden</button>
        </div>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="max-w-7xl mx-auto px-6 py-6">
      <div class="grid grid-cols-5 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border border-brand-200 shadow-sm">
          <p class="text-xs text-brand-300 font-medium uppercase tracking-wide">Gesamt</p>
          <p class="text-2xl font-bold text-brand-800 mt-1" id="statTotal">0</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-brand-200 shadow-sm">
          <p class="text-xs text-brand-300 font-medium uppercase tracking-wide">Aktiv</p>
          <p class="text-2xl font-bold text-green-700 mt-1" id="statActive">0</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-brand-200 shadow-sm">
          <p class="text-xs text-brand-300 font-medium uppercase tracking-wide">Onboarding</p>
          <p class="text-2xl font-bold text-yellow-700 mt-1" id="statOnboarding">0</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-brand-200 shadow-sm">
          <p class="text-xs text-brand-300 font-medium uppercase tracking-wide">Gesperrt</p>
          <p class="text-2xl font-bold text-red-700 mt-1" id="statSuspended">0</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-brand-200 shadow-sm">
          <p class="text-xs text-brand-300 font-medium uppercase tracking-wide">Archiviert</p>
          <p class="text-2xl font-bold text-gray-500 mt-1" id="statArchived">0</p>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="flex gap-2 mb-4" id="filterTabs">
        <button onclick="setFilter('all')" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold transition-all" data-filter="all">Alle</button>
        <button onclick="setFilter('active')" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold transition-all" data-filter="active">Aktiv</button>
        <button onclick="setFilter('onboarding')" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold transition-all" data-filter="onboarding">Onboarding</button>
        <button onclick="setFilter('suspended')" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold transition-all" data-filter="suspended">Gesperrt</button>
        <button onclick="setFilter('archived')" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold transition-all" data-filter="archived">Archiviert</button>
      </div>

      <!-- Provider Table -->
      <div class="bg-white rounded-xl border border-brand-200 shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-brand-100">
          <h2 class="text-lg font-bold font-heading text-brand-800">ANBIETER</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-brand-50 text-brand-700 text-left text-xs uppercase tracking-wider">
                <th class="px-4 py-3 font-semibold">Status</th>
                <th class="px-4 py-3 font-semibold">Anzeigename</th>
                <th class="px-4 py-3 font-semibold">Firmenname</th>
                <th class="px-4 py-3 font-semibold">Rechtsform</th>
                <th class="px-4 py-3 font-semibold">Kontaktperson</th>
                <th class="px-4 py-3 font-semibold">E-Mail</th>
                <th class="px-4 py-3 font-semibold">Telefon</th>
                <th class="px-4 py-3 font-semibold">Stadt</th>
                <th class="px-4 py-3 font-semibold">Registriert am</th>
              </tr>
            </thead>
            <tbody id="providerTableBody">
              <tr><td colspan="9" class="px-4 py-8 text-center text-brand-300">Lade Anbieter...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" style="display:none" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal-content fade-in">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold font-heading text-brand-800" id="modalTitle">ANBIETER DETAILS</h2>
        <button onclick="closeModal()" class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-brand-100 text-brand-400 text-xl">&times;</button>
      </div>
      <div id="modalBody"></div>
      <div id="modalActions" class="mt-6 flex gap-3 border-t border-brand-100 pt-4"></div>
    </div>
  </div>

  <!-- Create Provider Modal -->
  <div id="createModal" style="display:none" class="modal-backdrop" onclick="if(event.target===this)closeCreateModal()">
    <div class="modal-content fade-in">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold font-heading text-brand-800">NEUEN PROVIDER ANLEGEN</h2>
        <button onclick="closeCreateModal()" class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-brand-100 text-brand-400 text-xl">&times;</button>
      </div>
      <div id="createError" style="display:none" class="mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200"></div>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Anzeigename *</label>
            <input id="cDisplayName" type="text" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="z.B. Tanzstudio Berlin" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Firmenname *</label>
            <input id="cCompanyName" type="text" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="z.B. Tanzstudio Berlin GmbH" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Rechtsform</label>
            <select id="cLegalForm" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400">
              <option value="">-- Auswahl --</option>
              <option value="Einzelunternehmen">Einzelunternehmen</option>
              <option value="GbR">GbR</option>
              <option value="GmbH">GmbH</option>
              <option value="UG">UG (haftungsbeschraenkt)</option>
              <option value="e.V.">e.V.</option>
              <option value="gGmbH">gGmbH</option>
              <option value="Freiberufler">Freiberufler</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Kontaktperson *</label>
            <input id="cContactName" type="text" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="Vor- und Nachname" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">E-Mail *</label>
            <input id="cEmail" type="email" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="email@beispiel.de" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Passwort *</label>
            <input id="cPassword" type="password" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="Min. 8 Zeichen" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Telefon</label>
          <input id="cPhone" type="text" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="+49 30 1234567" />
        </div>
        <div class="grid grid-cols-3 gap-4">
          <div class="col-span-2">
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Strasse</label>
            <input id="cStreet" type="text" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="Musterstr. 1" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">PLZ</label>
            <input id="cZip" type="text" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="10115" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Stadt</label>
            <input id="cCity" type="text" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="Berlin" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-400 uppercase tracking-wide mb-1">Status</label>
            <select id="cStatus" class="w-full px-3 py-2 rounded-lg border border-brand-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400">
              <option value="active">Aktiv</option>
              <option value="onboarding">Onboarding</option>
            </select>
          </div>
        </div>
      </div>
      <div class="mt-6 flex gap-3 border-t border-brand-100 pt-4">
        <button onclick="createProvider()" class="px-6 py-2 rounded-lg text-sm font-semibold text-white transition-all" style="background:linear-gradient(135deg,#CC895E,#B5533A)">Provider anlegen</button>
        <button onclick="closeCreateModal()" class="px-4 py-2 rounded-lg text-sm font-medium bg-brand-100 text-brand-700 hover:bg-brand-200 transition-all ml-auto">Abbrechen</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yuilhiqnrjuuqoqggihm.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1aWxoaXFucmp1dXFvcWdnaWhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNzUxMDAsImV4cCI6MjA5MDc1MTEwMH0.8dnGBOapmuTwEUy0VG-VnSgIAgRf10F4L1wi9gcE0iw'
    const API_BASE = window.location.origin + '/api'
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let providers = []
    let accessToken = null
    let activeFilter = 'all'

    // ---- Auth ----
    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim()
      const password = document.getElementById('loginPassword').value
      const errEl = document.getElementById('loginError')
      errEl.style.display = 'none'

      if (!email || !password) {
        errEl.textContent = 'Bitte E-Mail und Passwort eingeben.'
        errEl.style.display = 'block'
        errEl.style.background = 'rgba(220,38,38,0.15)'
        errEl.style.color = '#fca5a5'
        errEl.style.border = '1px solid rgba(220,38,38,0.3)'
        return
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password })
      if (error) {
        errEl.textContent = error.message
        errEl.style.display = 'block'
        errEl.style.background = 'rgba(220,38,38,0.15)'
        errEl.style.color = '#fca5a5'
        errEl.style.border = '1px solid rgba(220,38,38,0.3)'
        return
      }

      accessToken = data.session.access_token

      // Check admin access
      try {
        const resp = await apiFetch('/admin/check')
        if (!resp.admin) throw new Error('Kein Admin')
      } catch (e) {
        errEl.textContent = 'Kein Admin-Zugang fuer dieses Konto.'
        errEl.style.display = 'block'
        errEl.style.background = 'rgba(220,38,38,0.15)'
        errEl.style.color = '#fca5a5'
        errEl.style.border = '1px solid rgba(220,38,38,0.3)'
        await sb.auth.signOut()
        accessToken = null
        return
      }

      document.getElementById('adminEmail').textContent = email
      document.getElementById('loginScreen').style.display = 'none'
      document.getElementById('mainContent').style.display = 'block'
      initFilterTabs()
      loadProviders()
    }

    async function doLogout() {
      await sb.auth.signOut()
      accessToken = null
      document.getElementById('loginScreen').style.display = 'flex'
      document.getElementById('mainContent').style.display = 'none'
    }

    // ---- API Helper ----
    async function apiFetch(path, opts = {}) {
      const resp = await fetch(API_BASE + path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + accessToken,
          ...(opts.headers || {})
        },
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      })
      const json = await resp.json()
      if (!resp.ok) throw new Error(json.error || 'API-Fehler')
      return json
    }

    // ---- Load Providers ----
    async function loadProviders() {
      try {
        const resp = await apiFetch('/admin/providers')
        providers = resp.data || []
        renderStats()
        renderTable()
      } catch (e) {
        document.getElementById('providerTableBody').innerHTML =
          '<tr><td colspan="9" class="px-4 py-8 text-center text-red-500">Fehler: ' + escapeHtml(e.message) + '</td></tr>'
      }
    }

    // ---- Render Stats ----
    function renderStats() {
      document.getElementById('statTotal').textContent = providers.length
      document.getElementById('statActive').textContent = providers.filter(p => p.status === 'active').length
      document.getElementById('statOnboarding').textContent = providers.filter(p => p.status === 'onboarding').length
      document.getElementById('statSuspended').textContent = providers.filter(p => p.status === 'suspended').length
      document.getElementById('statArchived').textContent = providers.filter(p => p.status === 'archived').length
    }

    // ---- Filter ----
    function setFilter(filter) {
      activeFilter = filter
      // Update tab styling
      document.querySelectorAll('.filter-tab').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.style.background = '#B5533A'
          btn.style.color = 'white'
        } else {
          btn.style.background = '#FFEFE1'
          btn.style.color = '#3C2124'
        }
      })
      renderTable()
    }

    // ---- Render Table ----
    function renderTable() {
      const tbody = document.getElementById('providerTableBody')
      const filtered = activeFilter === 'all' ? providers : providers.filter(p => p.status === activeFilter)
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-8 text-center text-brand-300">Keine Anbieter gefunden.</td></tr>'
        return
      }
      tbody.innerHTML = filtered.map(p => `
        <tr class="provider-row border-b border-brand-50 ${p.status === 'archived' ? 'row-archived' : ''}" onclick="showDetail('${p.id}')">
          <td class="px-4 py-3">${statusBadge(p.status)}</td>
          <td class="px-4 py-3 font-medium text-brand-800">${escapeHtml(p.display_name || '-')}</td>
          <td class="px-4 py-3 text-brand-600">${escapeHtml(p.company_name || '-')}</td>
          <td class="px-4 py-3 text-brand-400">${escapeHtml(p.legal_form || '-')}</td>
          <td class="px-4 py-3 text-brand-600">${escapeHtml(p.contact_name || '-')}</td>
          <td class="px-4 py-3 text-brand-400">${escapeHtml(p.email || '-')}</td>
          <td class="px-4 py-3 text-brand-400">${escapeHtml(p.phone || '-')}</td>
          <td class="px-4 py-3 text-brand-400">${escapeHtml(p.address_city || '-')}</td>
          <td class="px-4 py-3 text-brand-400">${formatDate(p.created_at)}</td>
        </tr>
      `).join('')
    }

    // ---- Detail Modal ----
    function showDetail(id) {
      const p = providers.find(x => x.id === id)
      if (!p) return

      document.getElementById('modalTitle').textContent = (p.display_name || p.company_name || 'Anbieter').toUpperCase()

      const fields = [
        ['ID', p.id],
        ['Status', statusBadge(p.status)],
        ['Anzeigename', p.display_name],
        ['Firmenname', p.company_name],
        ['Rechtsform', p.legal_form],
        ['Kontaktperson', p.contact_name],
        ['E-Mail', p.email],
        ['Telefon', p.phone],
        ['Adresse', [p.address_street, p.address_zip, p.address_city].filter(Boolean).join(', ')],
        ['Steuernummer', p.tax_id],
        ['USt-IdNr.', p.vat_id],
        ['Website', p.website],
        ['Slug', p.slug],
        ['Registriert am', formatDate(p.created_at)],
        ['Zuletzt aktualisiert', formatDate(p.updated_at)],
      ]

      document.getElementById('modalBody').innerHTML = `
        <div class="space-y-2">
          ${fields.map(([label, value]) => `
            <div class="flex items-start py-1.5 border-b border-brand-50">
              <span class="w-40 text-xs font-semibold text-brand-400 uppercase tracking-wide flex-shrink-0">${label}</span>
              <span class="text-sm text-brand-800">${value || '<span class="text-brand-200">-</span>'}</span>
            </div>
          `).join('')}
        </div>
      `

      // Actions
      const actionsEl = document.getElementById('modalActions')
      let actions = ''
      if (p.status === 'onboarding') {
        actions += `<button onclick="setStatus('${p.id}','active')" class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-green-600 hover:bg-green-700 transition-all">Freischalten</button>`
      }
      if (p.status === 'active') {
        actions += `<button onclick="setStatus('${p.id}','suspended')" class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-red-600 hover:bg-red-700 transition-all">Sperren</button>`
      }
      if (p.status === 'suspended') {
        actions += `<button onclick="setStatus('${p.id}','active')" class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-green-600 hover:bg-green-700 transition-all">Aktivieren</button>`
      }
      if (p.status !== 'archived') {
        actions += `<button onclick="archiveProvider('${p.id}')" class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-gray-600 hover:bg-gray-700 transition-all">Archivieren</button>`
      }
      actions += `<button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium bg-brand-100 text-brand-700 hover:bg-brand-200 transition-all ml-auto">Schliessen</button>`
      actionsEl.innerHTML = actions

      document.getElementById('detailModal').style.display = 'flex'
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none'
    }

    // ---- Status Update ----
    async function setStatus(id, status) {
      const labels = { active: 'aktivieren', suspended: 'sperren' }
      if (!confirm('Anbieter wirklich ' + (labels[status] || status) + '?')) return

      try {
        await apiFetch('/admin/providers/' + id + '/status', {
          method: 'POST',
          body: { status }
        })
        await loadProviders()
        // Refresh modal if still open
        const modal = document.getElementById('detailModal')
        if (modal.style.display === 'flex') {
          showDetail(id)
        }
      } catch (e) {
        alert('Fehler: ' + e.message)
      }
    }

    // ---- Helpers ----
    function statusBadge(status) {
      const map = { active: ['badge-active','Aktiv'], suspended: ['badge-suspended','Gesperrt'], archived: ['badge-archived','Archiviert'], onboarding: ['badge-onboarding','Onboarding'] }
      const [cls, label] = map[status] || ['badge-onboarding', status]
      return `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${cls}">${label}</span>`
    }

    function formatDate(iso) {
      if (!iso) return '-'
      const d = new Date(iso)
      return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
    }

    function escapeHtml(str) {
      if (!str) return ''
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    // ---- Archive Provider ----
    async function archiveProvider(id) {
      if (!confirm('Provider archivieren? Die Daten bleiben erhalten, aber der Zugang wird deaktiviert.')) return
      try {
        await apiFetch('/admin/providers/' + id + '/archive', { method: 'POST' })
        await apiFetch('/admin/providers/' + id + '/delete-auth', { method: 'POST' })
        closeModal()
        await loadProviders()
      } catch (e) {
        alert('Fehler: ' + e.message)
      }
    }

    // ---- Create Provider Modal ----
    function openCreateModal() {
      document.getElementById('createError').style.display = 'none'
      ;['cDisplayName','cCompanyName','cLegalForm','cContactName','cEmail','cPassword','cPhone','cStreet','cZip','cCity'].forEach(id => {
        document.getElementById(id).value = ''
      })
      document.getElementById('cStatus').value = 'active'
      document.getElementById('createModal').style.display = 'flex'
    }

    function closeCreateModal() {
      document.getElementById('createModal').style.display = 'none'
    }

    async function createProvider() {
      const errEl = document.getElementById('createError')
      errEl.style.display = 'none'

      const body = {
        displayName: document.getElementById('cDisplayName').value.trim(),
        companyName: document.getElementById('cCompanyName').value.trim(),
        legalForm: document.getElementById('cLegalForm').value,
        contactName: document.getElementById('cContactName').value.trim(),
        email: document.getElementById('cEmail').value.trim(),
        password: document.getElementById('cPassword').value,
        phone: document.getElementById('cPhone').value.trim(),
        street: document.getElementById('cStreet').value.trim(),
        zip: document.getElementById('cZip').value.trim(),
        city: document.getElementById('cCity').value.trim(),
        status: document.getElementById('cStatus').value,
      }

      if (!body.displayName || !body.companyName || !body.contactName || !body.email || !body.password) {
        errEl.textContent = 'Bitte alle Pflichtfelder (*) ausfuellen.'
        errEl.style.display = 'block'
        return
      }

      try {
        await apiFetch('/admin/providers', { method: 'POST', body })
        closeCreateModal()
        await loadProviders()
      } catch (e) {
        errEl.textContent = 'Fehler: ' + e.message
        errEl.style.display = 'block'
      }
    }

    // ---- Init filter tabs ----
    function initFilterTabs() {
      setFilter('all')
    }

    // ---- Auto-login from session ----
    ;(async () => {
      const { data: { session } } = await sb.auth.getSession()
      if (session) {
        accessToken = session.access_token
        try {
          const resp = await apiFetch('/admin/check')
          if (resp.admin) {
            document.getElementById('adminEmail').textContent = session.user.email
            document.getElementById('loginScreen').style.display = 'none'
            document.getElementById('mainContent').style.display = 'block'
            initFilterTabs()
            loadProviders()
          }
        } catch (e) {
          accessToken = null
        }
      }
    })()
  </script>
</body>
</html>
